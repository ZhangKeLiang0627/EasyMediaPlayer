name: Sync submodules

# 定期扫描账号下的 eMP-* 仓库，发现新应用就自动登记并开 PR。
# 新应用一律以 enabled: false 加入，不会自动进入固件，需要人工确认后才启用，
# 因此这个流程不会把 CI 编译弄坏。
#
# 容错约定 —— 只在「真的判断不了」时才让流程失败：
#   * 候选仓库是空的 / 分支不存在 / 无权访问 -> 跳过并告警，不影响同批其它候选
#   * 网络抖动 -> API 与 git 调用都带重试
#   * 仓库不允许 Actions 开 PR -> 不开 PR，改上传改动补丁，流程仍然通过
on:
  schedule:
    - cron: '17 3 * * 1'      # 每周一 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover new apps
        id: discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --verify 会对每个候选探一次分支是否存在。空仓库、分支被删的候选
          # 在这里就被标记 branch_ok=false，不会进到登记环节把整步弄红。
          python3 scripts/emp.py discover --json --verify > /tmp/new_apps.json
          count=$(python3 -c "import json;print(len(json.load(open('/tmp/new_apps.json'))))")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          cat /tmp/new_apps.json

      - name: Register new apps
        id: register
        if: steps.discover.outputs.count != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          new = json.load(open("/tmp/new_apps.json"))
          mf = Path("scripts/apps.yaml")
          text = mf.read_text(encoding="utf-8")

          # 分支探测没通过的候选直接跳过：登记了也 add 不上，
          # 只会让 sync-submodules 多一次失败。留个 warning 便于人工确认。
          usable = [a for a in new if a.get("branch_ok") is not False]
          skipped = [a for a in new if a.get("branch_ok") is False]
          for a in skipped:
              print(f"::warning::{a['name']} 的 {a['default_branch']} 分支不存在"
                    f"或仓库为空，跳过登记（确认无用可加入 apps.yaml 的 exclude）")

          # 去重：重跑同一个 run 或 PR 已合并后又被发现时，不要重复登记
          todo = [a for a in usable if f"name: {a['name']}" not in text]

          def done(n: int, msg: str) -> None:
              Path("/tmp/registered.txt").write_text(str(n), encoding="utf-8")
              print(msg)
              raise SystemExit(0)

          if not todo:
              done(0, "候选均已在 apps.yaml 中登记，跳过")

          # 分组注释只在文件里还没有时插一次，避免每发现一个应用就堆一行
          header = "  # ---------- 由 sync-submodules 工作流自动登记（默认不打包） ----------"
          block = [] if header.strip() in text else ["", header]
          for a in todo:
              block += [
                  f"  - name: {a['name']}",
                  f"    repo: ZhangKeLiang0627/{a['name']}",
                  f"    branch: {a['default_branch']}",
                  f"    binary: {a['name']}",
                  "    build: make",
                  "    enabled: false",
                  "    note: 自动发现，待人工验证后启用",
                  "",
              ]
          # 插到「排除名单」段落之前（连带它上面那行注释一起作为分界），
          # 否则新条目会落在排除名单标题下面，读起来像是被排除掉的
          idx = -1
          for marker in ("\n# ---------- 发现新应用时的排除名单", "\nexclude:"):
              idx = text.find(marker)
              if idx != -1:
                  break
          if idx == -1:
              text += "\n" + "\n".join(block) + "\n"
          else:
              text = text[:idx] + "\n".join(block) + text[idx:]
          mf.write_text(text, encoding="utf-8")
          done(len(todo), f"已登记 {len(todo)} 个新应用到 apps.yaml")
          PY

          # --tolerant：单个应用 add 失败只告警不中止，避免一个坏仓库
          # 挡住同批次其它正常候选
          python3 scripts/emp.py sync-submodules --tolerant

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apps.yaml
          [ -f .gitmodules ] && git add .gitmodules
          git status --short
          # 挂成补丁，万一开不了 PR 也能人工取走
          git diff --cached > /tmp/auto-register.patch

          echo "registered=$(cat /tmp/registered.txt 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        id: openpr
        # 不要用 GITHUB_TOKEN 预读 can_approve_pull_request_reviews 来判断权限：
        # 那个端点需要 admin，installation token 只会拿到 None，会把"其实可以"
        # 误判成"不可以"，PR 就再也开不出来。改成直接尝试，失败再降级。
        # continue-on-error：仓库若真关了「Allow GitHub Actions to create and
        # approve pull requests」，这一步会失败，但不让整个流程判红，
        # 由后面的 Warn/Upload patch 步骤接管。
        if: steps.discover.outputs.count != '0' && steps.register.outputs.registered != '0'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.EMP_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: chore/auto-register-apps
          title: '@add(sub): 自动登记新发现的 eMP 应用'
          commit-message: |
            @add(sub): 自动登记新发现的 eMP 应用

            由 sync-submodules 工作流扫描 GitHub 仓库后生成。
            新应用默认 enabled: false，不会进入固件打包，需人工验证后启用。

            Co-Authored-By: Claude <noreply@anthropic.com>
          body: |
            ## 自动发现的新应用

            扫描 `ZhangKeLiang0627` 账号下带 `emp-app` topic（或 `eMP-*` 命名）的仓库，
            发现以下尚未登记的候选，已写入 `scripts/apps.yaml` 并添加为子模块。

            > 全部以 `enabled: false` 登记，**不会**进入 `firmware.tar.gz`。

            请检查后把确认可用的应用改成 `enabled: true`。

            合并前建议本地跑一次：
            ```bash
            python3 scripts/emp.py check
            ./scripts/build-all.sh
            ```
          labels: |
            automated

      - name: Warn on PR failure
        if: steps.openpr.outcome == 'failure'
        run: |
          echo "::warning::自动开 PR 失败，改动已保存为 auto-register-patch。最常见原因是仓库未允许 Actions 创建 PR：Settings -> Actions -> General -> Workflow permissions 勾选 Allow GitHub Actions to create and approve pull requests，或配置 EMP_PR_TOKEN。"

      - name: Upload patch
        if: steps.openpr.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: auto-register-patch
          path: /tmp/auto-register.patch
          if-no-files-found: warn
